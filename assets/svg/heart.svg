<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512">

    <defs>

        <!-- Premium Pink Gradient -->
        <linearGradient
            id="heartGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%">

            <stop offset="0%" stop-color="#ff9dbf"/>
            <stop offset="25%" stop-color="#ff6f9d"/>
            <stop offset="60%" stop-color="#ff3d7f"/>
            <stop offset="100%" stop-color="#e6005c"/>

        </linearGradient>

        <!-- Soft Glow -->
        <filter
            id="glow"
            x="-60%"
            y="-60%"
            width="220%"
            height="220%">

            <feGaussianBlur
                stdDeviation="10"
                result="blur"/>

            <feMerge>

                <feMergeNode in="blur"/>

                <feMergeNode in="SourceGraphic"/>

            </feMerge>

        </filter>

    </defs>

    <!-- Main Heart -->
    <path
        filter="url(#glow)"
        fill="url(#heartGradient)"
        d="

        M256 455

        C245 444
        228 429
        208 410

        C122 332
        70 285
        45 242

        C18 196
        18 128
        66 82

        C110 40
        176 39
        223 78

        C239 91
        249 108
        256 126

        C263 108
        273 91
        289 78

        C336 39
        402 40
        446 82

        C494 128
        494 196
        467 242

        C442 285
        390 332
        304 410

        C284 429
        267 444
        256 455

        Z"/>

    <!-- Soft Highlight -->
    <path
        fill="rgba(255,255,255,.22)"
        opacity=".18"
        d="

        M195 95

        C165 70
        118 73
        86 104

        C70 120
        61 141
        58 164

        C73 140
        89 123
        111 111

        C142 94
        173 92
        195 95

        Z"/>

</svg>